# 游戏内 F1 可调整与校准；直接修改本文件后按 F5 重载。路径相对于本文件。
[music]
path = "music/Rhythm hot pot vocal1001.mp3"
volume = 0.65

[rhythm]
bpm = 140.0                         # 示例曲目参数；可在设置页手动修改或速度校准
beat_start_seconds = 3.85           # 当前曲目的首拍位置；换曲后请手动设置或校准
beat_offset_ms = -15.82             # 本曲低频起音比 4.0s 网格晚约 180ms；若重拍仍偏，按 ±5ms 微调
beats_per_bar = 4                  # 可改每小节四分拍数；note_values 须同时填满小节
game_bars = 0                     # 0 = 自动用满剩余音乐中的完整小节；预备小节另计
# 练习谱面：普通数字为分母，"8." 为附点八分；r4/r8/r16 为休止，0=r4；每个数组恰好填满一个小节。
# 多个谱面小节按顺序循环；这些是 demo 节奏，不是音乐自动提取的正式谱。
note_values = [4, 4, 4, 4]
patterns = [[4, 4, 4, 4], [4, "r4", 4, 4], [8, 8, 4, 4, 4], ["r8", 8, 4, 4, 4]]

[judgment]
window_ms = 100.0                  # 首版试用容差，不是已确认的演出验收值
max_mistakes = 50                   # 正式出错四分拍达到此数即输掉；每拍最多计 1，0 不限
input_offset_ms = 0.0              # 输入延迟补偿：正值从输入时间中减去；与整曲偏移分开

[audio]
device = ""                       # 空字符串使用系统默认；蓝牙可能 >100ms，建议填内置/有线设备名
blocksize = 128                    # 可尝试 0（设备自动）、64、128、256；需实测稳定性
clap_path = ""                    # 空字符串使用程序生成的短拍手声；可换成 WAV/MP3
clap_volume = 0.45

[display]
width = 1280
height = 800
lookahead_seconds = 3.0

[input]
enabled = true                     # 启用本地 socket 接收 Joy-Con 脚本的拍掌
socket_path = "tmp/joycon-clap.sock"   # 相对本文件；发送脚本使用同一路径
max_age_ms = 250.0                 # 超过此时长的旧消息丢弃；不是判定容差
